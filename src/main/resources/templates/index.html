<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>URL Shortner</title>

<style> 
* { box-sizing: border-box; } 

body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f5f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f2937; padding: 20px; } 
.container { width: 100%; max-width: 520px; background: #ffffff; border-radius: 18px; padding: 36px 32px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid #eef2f7; } 
h1 { margin: 0 0 8px; font-size: 1.9rem; text-align: center; font-weight: 700; color: #111827; } 
.subtitle { text-align: center; color: #6b7280; margin-bottom: 28px; font-size: 0.95rem; } 
form { display: flex; flex-direction: column; gap: 16px; } 
label { font-weight: 600; font-size: 0.95rem; color: #374151; } 
input[type="text"] { width: 100%; padding: 14px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 0.95rem; background: #fafafa; transition: border-color 0.2s ease, background 0.2s ease; } 
input[type="text"]:focus { outline: none; border-color: #4f46e5; background: #ffffff; } 
button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #111827; color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; } 
button:hover { background: #1f2937; } 
.result { margin-top: 26px; padding: 18px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 14px; } 
.result h2 { margin: 0 0 14px; font-size: 1.05rem; color: #111827; } 
.result p { margin: 10px 0; font-size: 0.92rem; line-height: 1.5; color: #374151; word-break: break-word; } 
.result span { color: #111827; font-weight: 500; } 
.result a { color: #4f46e5; text-decoration: none; font-weight: 600; word-break: break-all; } 
.result a:hover { text-decoration: underline; } 
@media (max-width: 480px) { 
	.container { padding: 28px 22px; } 
	h1 { font-size: 1.6rem; } 
} 

</style>

</head>
<body>

<div class="container"> 
	
	<h1>URL Shortener</h1> 
	<p class="subtitle">Turn long links into clean, shareable URLs</p>

<form th:action="@{/shorten-web}" method="post">
	
	<div>
	<label for="longUrl">Enter Long Url : </label>
	</div>
	<br><br>
	<div>
	<input type="text"
		   id="longUrl"
		   name="longUrl"
		   placeholder="https://www.example.com"
		   size="50"
		   required>
	</div>
	<br><br>
	<div>
	<button type="submit">Shorten URL</button>
	</div>
</form>

<div class="result" th:if="${shortUrlResult != null}">

<h2>Success!! Here is your Short Url.</h2>

<p>Original URL:
<span th:text="${originalUrl}"></span>
</p>

<p>Shorten URL:
<a th:href="${shortUrlResult}" th:text="${shortUrlResult}" target="blank"></a>
</p>

</div>

</div>

</body>
</html>
